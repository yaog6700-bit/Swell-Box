<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swell-Box 面板</title>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel-hover: #1c2128;
  --border: #30363d;
  --primary: #58a6ff;
  --primary-hover: #1f6feb;
  --active: #238636;
  --active-bg: rgba(35, 134, 54, 0.15);
  --active-border: #2ea043;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --danger: #f85149;
  --warning: #d29922;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo-icon {
  width: 28px;
  height: 28px;
  background: var(--primary);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  color: #000;
  font-size: 16px;
}
.brand h1 { font-size: 18px; font-weight: 600; }
.traffic-stats {
  display: flex;
  gap: 20px;
  font-size: 13px;
  color: var(--text-muted);
}
.traffic-val {
  color: var(--text);
  font-weight: 600;
  font-family: Consolas, monospace;
}
.controls {
  display: flex;
  gap: 10px;
  align-items: center;
}
button {
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 7px 14px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
button:hover {
  background: var(--panel-hover);
  border-color: var(--text-muted);
}
button.primary {
  background: var(--primary);
  color: #000;
  border-color: transparent;
  font-weight: 600;
}
button.primary:hover {
  background: var(--primary-hover);
  color: #fff;
}
main {
  flex: 1;
  max-width: 1200px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
}
.group-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.group-title .badge {
  background: var(--border);
  color: var(--text-muted);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
}
.node-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
  margin-bottom: 30px;
}
.node-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.18s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 10px;
  position: relative;
  user-select: none;
}
.node-card:hover {
  border-color: var(--primary);
  background: var(--panel-hover);
  transform: translateY(-1px);
}
.node-card.active {
  background: var(--active-bg);
  border-color: var(--active-border);
  box-shadow: 0 0 0 1px var(--active-border);
}
.node-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.node-name {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  word-break: break-all;
}
.node-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: var(--text-muted);
}
.node-type {
  text-transform: uppercase;
  font-size: 10px;
  font-weight: 700;
  background: rgba(255, 255, 255, 0.06);
  padding: 2px 6px;
  border-radius: 4px;
}
.node-delay {
  font-family: Consolas, monospace;
  font-size: 11px;
  font-weight: 600;
}
.node-delay.good { color: #3fb950; }
.node-delay.medium { color: var(--warning); }
.node-delay.slow { color: var(--danger); }
.status-pill {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #3fb950;
  display: inline-block;
}
.status-pill.error { background: var(--danger); }
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.25s ease;
  z-index: 1000;
}
#toast.show {
  transform: translateY(0);
  opacity: 1;
}
.loading-box {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo-icon">&#x26cf;</div>
    <div>
      <h1>Swell-Box 控制面板</h1>
    </div>
  </div>
  <div class="traffic-stats">
    <div>下行: <span id="downSpeed" class="traffic-val">0 B/s</span></div>
    <div>上行: <span id="upSpeed" class="traffic-val">0 B/s</span></div>
  </div>
  <div class="controls">
    <button id="btnPing" onclick="pingAll()">&#x26a1; 测速全部</button>
    <button onclick="loadProxies()">&#x21bb; 刷新</button>
  </div>
</header>

<main id="mainContainer">
  <div class="loading-box">正在加载节点列表…</div>
</main>

<div id="toast"></div>

<script>
const params = new URLSearchParams(window.location.search);
const apiPort = params.get('port') || '9090';
const apiSecret = params.get('secret') || 'swellbox';
const apiBase = `http://127.0.0.1:${apiPort}`;

function authHeaders() {
  const h = { 'Content-Type': 'application/json' };
  if (apiSecret) h['Authorization'] = `Bearer ${apiSecret}`;
  return h;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.className = 'show';
  setTimeout(() => { t.className = ''; }, 2200);
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B/s';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB/s';
  return (b / 1048576).toFixed(1) + ' MB/s';
}

let trafficEventSource = null;
function initTraffic() {
  try {
    const wsUrl = `ws://127.0.0.1:${apiPort}/traffic?token=${encodeURIComponent(apiSecret)}`;
    const ws = new WebSocket(wsUrl);
    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        document.getElementById('upSpeed').innerText = fmtBytes(data.up || 0);
        document.getElementById('downSpeed').innerText = fmtBytes(data.down || 0);
      } catch(_) {}
    };
    ws.onerror = () => {};
  } catch(_) {}
}

let currentGroup = 'proxy';
let allProxies = {};

async function loadProxies() {
  try {
    const res = await fetch(`${apiBase}/proxies`, { headers: authHeaders() });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allProxies = data.proxies || {};
    render();
  } catch(err) {
    document.getElementById('mainContainer').innerHTML = `
      <div class="loading-box" style="color:var(--danger)">
        <h3>连接核心 API 失败</h3>
        <p style="margin-top:8px;font-size:13px;color:var(--text-muted)">
          地址: ${apiBase} · 错误: ${err.message}
        </p>
        <p style="margin-top:6px;font-size:12px;color:var(--text-muted)">
          请确认 Swell-Box 核心代理已正常启动运行。
        </p>
      </div>`;
  }
}

function render() {
  const container = document.getElementById('mainContainer');
  let groups = [];
  for (let k in allProxies) {
    const p = allProxies[k];
    if (p.type === 'Selector' || p.all && p.all.length > 0) {
      groups.push(p);
    }
  }
  if (groups.length === 0) {
    container.innerHTML = `<div class="loading-box">当前暂无可选代理分组</div>`;
    return;
  }

  let html = '';
  for (let g of groups) {
    html += `
      <div class="group-title">
        <span>分组: ${g.name}</span>
        <span class="badge">${g.all ? g.all.length : 0} 个节点</span>
        <span style="margin-left:auto;font-size:12px;color:var(--text-muted)">
          当前: <strong style="color:var(--primary)">${g.now || '—'}</strong>
        </span>
      </div>
      <div class="node-grid">`;

    for (let nodeName of (g.all || [])) {
      const node = allProxies[nodeName] || { name: nodeName, type: 'Proxy' };
      const isActive = g.now === nodeName;
      const history = node.history || [];
      let delayText = '';
      let delayClass = '';
      if (history.length > 0) {
        const last = history[history.length - 1];
        if (last && last.delay > 0) {
          delayText = `${last.delay} ms`;
          if (last.delay < 180) delayClass = 'good';
          else if (last.delay < 400) delayClass = 'medium';
          else delayClass = 'slow';
        } else if (last && last.delay === 0) {
          delayText = '超时';
          delayClass = 'slow';
        }
      }

      html += `
        <div class="node-card ${isActive ? 'active' : ''}" onclick="selectNode('${g.name}', '${nodeName}')">
          <div class="node-header">
            <span class="node-name">${nodeName}</span>
            ${isActive ? '<span style="color:#2ea043;font-weight:bold">&#x2714;</span>' : ''}
          </div>
          <div class="node-meta">
            <span class="node-type">${node.type || 'Proxy'}</span>
            <span class="node-delay ${delayClass}" id="delay-${nodeName}">${delayText}</span>
          </div>
        </div>`;
    }
    html += `</div>`;
  }
  container.innerHTML = html;
}

async function selectNode(group, nodeName) {
  try {
    const res = await fetch(`${apiBase}/proxies/${encodeURIComponent(group)}`, {
      method: 'PUT',
      headers: authHeaders(),
      body: JSON.stringify({ name: nodeName })
    });
    if (res.ok || res.status === 204) {
      if (allProxies[group]) allProxies[group].now = nodeName;
      render();
      showToast(`已切换至: ${nodeName}`);
    } else {
      showToast(`切换失败: HTTP ${res.status}`);
    }
  } catch(err) {
    showToast(`切换错误: ${err.message}`);
  }
}

async function pingNode(name) {
  const el = document.getElementById(`delay-${name}`);
  if (el) el.innerText = '…';
  try {
    const testUrl = encodeURIComponent('http://www.gstatic.com/generate_204');
    const res = await fetch(`${apiBase}/proxies/${encodeURIComponent(name)}/delay?timeout=2500&url=${testUrl}`, {
      headers: authHeaders()
    });
    if (res.ok) {
      const data = await res.json();
      if (el) {
        el.innerText = `${data.delay} ms`;
        el.className = 'node-delay ' + (data.delay < 180 ? 'good' : (data.delay < 400 ? 'medium' : 'slow'));
      }
    } else {
      if (el) { el.innerText = '超时'; el.className = 'node-delay slow'; }
    }
  } catch(_) {
    if (el) { el.innerText = '错误'; el.className = 'node-delay slow'; }
  }
}

async function pingAll() {
  const btn = document.getElementById('btnPing');
  btn.disabled = true;
  btn.innerText = '正在测速…';
  const group = allProxies['proxy'];
  const nodes = group && group.all ? group.all : Object.keys(allProxies);
  const tasks = nodes.filter(n => allProxies[n] && allProxies[n].type !== 'Selector' && allProxies[n].type !== 'Direct' && allProxies[n].type !== 'Reject');
  await Promise.allSettled(tasks.map(n => pingNode(n)));
  btn.disabled = false;
  btn.innerHTML = '&#x26a1; 测速全部';
}

loadProxies();
initTraffic();
setInterval(loadProxies, 4000);
</script>
</body>
</html>
